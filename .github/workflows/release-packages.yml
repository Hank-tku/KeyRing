name: Release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to, for example v0.1.1
        required: true
        default: v0.1.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 前置 job：先创建 release，其余 job 上传 asset 时 release 必然已存在，
  # 避免"最早跑完的 job 撞上 release 未创建导致静默不上传"。
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if missing
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false

  windows:
    name: Windows zip
    runs-on: windows-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath build/release/KeyRing-Windows-${{ github.event.inputs.tag || github.ref_name }}.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyRing-Windows
          path: build/release/*.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/release/*.zip

  android:
    name: Android APK (split per ABI)
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置，回退 debug 签名（不可覆盖安装已发布版本）"
            exit 0
          fi
          # build.gradle.kts 中 storeFile 相对 android/app/ 目录解析
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keyring-release.jks
          cat > android/key.properties <<EOF
          storeFile=keyring-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Android APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Package Android
        run: |
          mkdir -p build/release
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          for f in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "build/release/KeyRing-Android-${base}-${TAG}.apk"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyRing-Android
          path: build/release/*.apk

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/release/*.apk

  macos:
    name: macOS app
    runs-on: macos-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS
        run: |
          mkdir -p build/release
          # ditto 输出到项目根的 build/release/；从 Products/Release 回到 build/ 需后退 4 级。
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent \
            "key_ring.app" \
            "../../../../release/KeyRing-macOS-${{ github.event.inputs.tag || github.ref_name }}.zip"
          ls -la ../../../../release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyRing-macOS
          path: build/release/*.zip
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/release/*.zip

  ios:
    name: iOS unsigned app
    runs-on: macos-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without codesign
        run: flutter build ios --release --no-codesign

      - name: Package iOS app
        run: |
          mkdir -p build/release
          ditto -c -k --keepParent \
            build/ios/iphoneos/Runner.app \
            "build/release/KeyRing-iOS-${{ github.event.inputs.tag || github.ref_name }}-unsigned.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyRing-iOS-unsigned
          path: build/release/*.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/release/*.zip
