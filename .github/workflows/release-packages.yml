name: Release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to, for example v0.1.1
        required: true
        default: v0.1.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows zip
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath build/release/KeyRing-Windows-${{ github.event.inputs.tag || github.ref_name }}.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyRing-Windows
          path: build/release/*.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/release/*.zip

  ios:
    name: iOS unsigned app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without codesign
        run: flutter build ios --release --no-codesign

      - name: Package iOS app
        run: |
          mkdir -p build/release
          ditto -c -k --keepParent \
            build/ios/iphoneos/Runner.app \
            "build/release/KeyRing-iOS-${{ github.event.inputs.tag || github.ref_name }}-unsigned.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyRing-iOS-unsigned
          path: build/release/*.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/release/*.zip
