<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background matching app theme -->
  <rect width="1024" height="1024" rx="226" fill="#121A2E"/>
  
  <!-- Shield shape with teal gradient -->
  <defs>
    <linearGradient id="shieldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <path d="M512 200 L800 280 L800 520 C800 680 680 800 512 840 C344 800 224 680 224 520 L224 280 Z" 
        fill="url(#shieldGrad)"/>
  
  <!-- Lock icon -->
  <g transform="translate(512, 500) scale(0.85)">
    <!-- Lock body -->
    <rect x="-65" y="0" width="130" height="150" rx="24" fill="#FFFFFF"/>
    
    <!-- Lock shackle -->
    <path d="M-65 0 L-65 -45 C-65 -90 -30 -125 0 -125 C30 -125 65 -90 65 -45 L65 0" 
          fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="45" r="22" fill="#2DD4BF"/>
    <rect x="-14" y="45" width="28" height="55" rx="14" fill="#2DD4BF"/>
  </g>
  
  <!-- Subtle border -->
  <path d="M512 200 L800 280 L800 520 C800 680 680 800 512 840 C344 800 224 680 224 520 L224 280 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.2" stroke-linejoin="round"/>
</svg>


