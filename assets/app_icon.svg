<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient matching app theme -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#121A2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.176  0 0 0 0 0.831  0 0 0 0 0.749  0 0 0 0.5 0"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="226" fill="url(#bgGradient)"/>
  
  <!-- Glow effect behind shield -->
  <path d="M512 180 L820 270 L820 540 C820 720 690 850 512 895 C334 850 204 720 204 540 L204 270 Z" 
        fill="url(#glowGradient)" filter="url(#glow)" opacity="0.6"/>
  
  <!-- Shield base -->
  <path d="M512 200 L800 280 L800 520 C800 680 680 800 512 840 C344 800 224 680 224 520 L224 280 Z" 
        fill="url(#shieldGradient)" filter="url(#shadow)"/>
  
  <!-- Shield border highlight -->
  <path d="M512 200 L800 280 L800 520 C800 680 680 800 512 840 C344 800 224 680 224 520 L224 280 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2" stroke-linejoin="round"/>
  
  <!-- Inner shield accent -->
  <path d="M512 240 L760 310 L760 510 C760 650 660 760 512 795 C364 760 264 650 264 510 L264 310 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.15" stroke-linejoin="round"/>
  
  <!-- Lock body -->
  <rect x="432" y="420" width="160" height="180" rx="24" fill="url(#lockGradient)" stroke="#2DD4BF" stroke-width="4"/>
  
  <!-- Lock shackle -->
  <path d="M440 420 L440 370 C440 320 470 290 512 290 C554 290 584 320 584 370 L584 420" 
        fill="none" stroke="url(#lockGradient)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Lock shackle inner glow -->
  <path d="M455 420 L455 375 C455 335 478 312 512 312 C546 312 569 335 569 375 L569 420" 
        fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Lock keyhole -->
  <circle cx="512" cy="490" r="20" fill="#2DD4BF"/>
  <rect x="502" y="490" width="20" height="50" rx="10" fill="#2DD4BF"/>
  
  <!-- Keyhole highlight -->
  <circle cx="506" cy="486" r="8" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Decorative key elements -->
  <circle cx="360" cy="420" r="8" fill="#2DD4BF" opacity="0.4"/>
  <circle cx="664" cy="420" r="8" fill="#2DD4BF" opacity="0.4"/>
  <circle cx="360" cy="560" r="6" fill="#2DD4BF" opacity="0.3"/>
  <circle cx="664" cy="560" r="6" fill="#2DD4BF" opacity="0.3"/>
</svg>


